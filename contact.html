<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Perantaranya</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="pe logo.png">
</head>

<body class="bg-white text-black">

<!-- NAVBAR -->
<script src="navbar.js"></script>

<!-- CONTENT -->
<section class="max-w-4xl mx-auto px-6 py-16">

    <h1 class="text-3xl font-bold mb-6">Perantaranya Management</h1>

    <!-- PHONE -->
    <p class="mb-2">
        <span class="font-semibold">Phone:</span>
        <button onclick="openModal()"
                class="text-blue-600 underline hover:opacity-70">
            +62 813-1711-6631 (Faruq)
        </button>
    </p>

    <!-- EMAIL (NORMAL) -->
    <p class="mb-2">
        <span class="font-semibold">Email:</span>
        <a href="mailto:perataranyaband@gmail.com"
           class="text-blue-600 underline hover:opacity-70">
            perataranyaband@gmail.com
        </a>
    </p>

    <p class="mb-6 leading-relaxed">
        Jl. Daksinapati Timur II No.3 <br>
        RT.7/RW.14, Rawamangun, Kec. Pulo Gadung, Kota Jakarta Timur <br>
        DKI Jakarta 13220
    </p>

    <!-- SOCIAL ICONS -->
    <div class="flex items-center gap-4 text-3xl">
        <a href="#" class="text-pink-600 hover:opacity-70">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" class="text-red-600 hover:opacity-70">
            <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="#" class="text-black hover:opacity-70">
            <i class="fa-brands fa-tiktok"></i>
        </a>
        <a href="#" class="text-blue-600 hover:opacity-70">
            <i class="fa-brands fa-facebook"></i>
        </a>
    </div>

</section>

<!-- MODAL -->
<div id="contactModal"
     class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">

    <div class="bg-white w-full max-w-md rounded-lg p-6 relative">

        <button onclick="closeModal()"
                class="absolute top-3 right-4 text-2xl">&times;</button>

        <h2 class="text-xl font-bold mb-4">
            Send Message via WhatsApp
        </h2>

        <form id="waForm" class="space-y-4">

            <input id="name" type="text" required
                   placeholder="Your Name"
                   class="w-full border px-4 py-2 rounded">

            <input id="email" type="email" required
                   placeholder="Your Email"
                   class="w-full border px-4 py-2 rounded">

            <textarea id="message" rows="4" required
                      placeholder="Your Message"
                      class="w-full border px-4 py-2 rounded"></textarea>

            <button type="submit"
                    class="w-full bg-[#6A0000] text-white py-2 rounded hover:bg-red-900 transition">
                Send to WhatsApp
            </button>

        </form>
    </div>
</div>

<!-- FONTAWESOME -->
<script src="https://kit.fontawesome.com/7c8e3f9f47.js" crossorigin="anonymous"></script>

<script src="footer.js"></script>

<!-- SCRIPT -->
<script>
function openModal() {
    const modal = document.getElementById("contactModal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
}

function closeModal() {
    const modal = document.getElementById("contactModal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
}

document.getElementById("waForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const finalMessage =
`Hello Perantaranya Management,

Name: ${name}
Email: ${email}

Message:
${message}`;

    const phoneNumber = "6281317116631"; // tanpa +
    const waURL =
        `https://wa.me/${phoneNumber}?text=${encodeURIComponent(finalMessage)}`;

    window.open(waURL, "_blank");
    closeModal();
});
</script>

</body>
</html>
